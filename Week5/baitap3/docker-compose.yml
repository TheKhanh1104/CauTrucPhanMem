version: '3.8'

services:
  flask1:
    build: .
    networks:
      - app_net

  flask2:
    build: .
    networks:
      - app_net

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - flask1
      - flask2
    networks:
      - app_net

networks:
  app_net:
    driver: bridge