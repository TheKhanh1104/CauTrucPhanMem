<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"> 
         <title>Food Delivery System</title>
    </head>
<body>
    <h2>Hệ thống Food Delivery - Service Based</h2>
    <form action="/api/orders/create" method="POST">
    <input type="text" name="customerName" placeholder="Nhập tên khách hàng">
    <select name="status">
        <option value="DELIVERING">Đang giao (Active)</option>
        <option value="COMPLETED">Hoàn thành (History)</option>
    </select>
    <button type="submit">Xác nhận</button>
</form>
</body>
</html>
